name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Publish Windows x64 app
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/ProjectAccel.App/ProjectAccel.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$version -p:InformationalVersion=$version -o artifacts/ProjectAccel

      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path artifacts/ProjectAccel/* -DestinationPath artifacts/ProjectAccel-${{ github.ref_name }}-win-x64.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ProjectAccel ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/ProjectAccel-${{ github.ref_name }}-win-x64.zip
