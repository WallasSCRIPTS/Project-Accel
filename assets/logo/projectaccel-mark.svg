<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202B3A"/>
      <stop offset="1" stop-color="#0F151D"/>
    </linearGradient>
    <linearGradient id="emberGrad" gradientUnits="userSpaceOnUse" x1="54" y1="184" x2="206" y2="68">
      <stop offset="0" stop-color="#FFB03A"/>
      <stop offset="0.5" stop-color="#FF6A3A"/>
      <stop offset="1" stop-color="#FF3D2E"/>
    </linearGradient>
  </defs>

  <!-- squircle base -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)"/>
  <rect x="12.75" y="12.75" width="230.5" height="230.5" rx="51.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- glow pass of the curve -->
  <path d="M 54 184 C 102 182, 118 170, 134 132 C 148 98, 166 82, 206 68"
        fill="none" stroke="url(#emberGrad)" stroke-width="34" stroke-linecap="round" opacity="0.20"/>

  <!-- the acceleration curve -->
  <path d="M 54 184 C 102 182, 118 170, 134 132 C 148 98, 166 82, 206 68"
        fill="none" stroke="url(#emberGrad)" stroke-width="19" stroke-linecap="round"/>

  <!-- input node (mouse) -->
  <circle cx="54" cy="184" r="12.5" fill="#35E0FF" stroke="#10161F" stroke-width="4.5"/>
  <circle cx="54" cy="184" r="4.2" fill="#EAFCFF"/>

  <!-- output spark (cursor) -->
  <circle cx="206" cy="68" r="6" fill="#FFD9A0"/>
</svg>
